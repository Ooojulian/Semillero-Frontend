# Requiere Dockerfiles en backend/ y frontend/ para funcionar.
# Para desarrollo local usa: cd backend && npm run dev / cd frontend && npm run dev
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    env_file: ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    ports:
      - "3002:3000"
